name: debug-net
on: workflow_dispatch
permissions: contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set -x
          getent hosts cdn.kernel.org || true
          curl -sv -o /tmp/body -D /tmp/hdrs "https://cdn.kernel.org/pub/software/scm/git/git-2.55.0.tar.gz" || true
          echo "--- response headers:"; cat /tmp/hdrs || true
          echo "--- body head:"; head -c 600 /tmp/body || true
          echo; echo "--- ipinfo:"
          curl -s https://ipinfo.io/json | head -5 || true
