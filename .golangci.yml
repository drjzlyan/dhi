version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    rules:
      # Tests routinely ignore setup/teardown errors on purpose.
      - path: _test\.go
        linters: [errcheck]
      # Test helpers keep explicit constant arguments (clock(2026, ...),
      # fixture names) because the call site reads better with them.
      - path: _test\.go
        linters: [unparam]
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - unconvert
    - unparam

formatters:
  enable:
    - gofmt
