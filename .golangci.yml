version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    rules:
      # Tests routinely ignore setup/teardown errors on purpose.
      - path: _test\.go
        linters: [errcheck]
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - unconvert
    - unparam

formatters:
  enable:
    - gofmt
